[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# Static library linked into the C plugin, plus rlib for `cargo test`.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
modulix-core-utils = { path = "../../modulix-core-utils", features = [
    "package-info",
    "app-info-gui",
    "module-info",
    "install-package",
    "install-module",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
strip = true
